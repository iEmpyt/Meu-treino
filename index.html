  <style>
    :root {
      --bg-main: #0B0F17;
      --bg-card: #141C2B;
      --bg-card-hover: #1E293B;
      --bg-input: #0F172A;
      --border-subtle: #1E293B;
      --border-accent: #334155;
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      
      --accent-a: #3B82F6; /* Treino A - Azul Sutil */
      --accent-b: #F97316; /* Treino B - Laranja Sutil */
      --accent-c: #10B981; /* Treino C - Verde Sutil */
      --danger: #EF4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding-bottom: 90px;
      padding-top: env(safe-area-inset-top);
      min-height: 100vh;
    }

    header {
      padding: 20px 16px 12px;
      background: rgba(11, 15, 23, 0.95);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid var(--border-subtle);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .header-title h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-main);
    }

    .header-title p {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn-icon {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      cursor: pointer;
    }

    /* Tabs de Treino */
    .nav-tabs {
      display: flex;
      gap: 8px;
      background: var(--bg-input);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
    }

    .tab-btn {
      flex: 1;
      padding: 10px 0;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active[data-target="A"] {
      background: var(--bg-card);
      color: var(--accent-a);
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .tab-btn.active[data-target="B"] {
      background: var(--bg-card);
      color: var(--accent-b);
      border: 1px solid rgba(249, 115, 22, 0.3);
    }

    .tab-btn.active[data-target="C"] {
      background: var(--bg-card);
      color: var(--accent-c);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    main {
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Card de Exercício */
    .exercise-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }

    .exercise-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .exercise-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .exercise-badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-a { background: rgba(59, 130, 246, 0.15); color: var(--accent-a); }
    .badge-b { background: rgba(249, 115, 22, 0.15); color: var(--accent-b); }
